name: pi_alarm
description: Phone app for pi-alarm. Sets wake-up alarms on the Pi over Bluetooth Low Energy.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Bluetooth Low Energy. Version 2.x has its own licence: free for personal
  # use, see https://pub.dev/packages/flutter_blue_plus/license
  flutter_blue_plus: ^2.3.15
  # Small key-value storage: the Pi's address, cached alarms, unsent changes.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
