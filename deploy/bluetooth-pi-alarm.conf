# The Pi does not need Bluetooth MIDI. With it on, the Pi's Bluetooth service
# asks a connecting device that offers MIDI (a Linux laptop, for one) to pair,
# gets refused, and drops the connection after a few seconds.
#
# Install on the Pi as /etc/systemd/system/bluetooth.service.d/pi-alarm.conf
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=midi
