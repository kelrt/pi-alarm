# Fixed addresses for the Pi's USB network link, so the laptop recognises the
# Pi on any USB port and after every boot. Without this, both ends get new
# random addresses each time the Pi starts.
#
# Install on the Pi as /etc/modprobe.d/pi-alarm-usb-gadget.conf
#
#   dev_addr   the Pi's end
#   host_addr  the laptop's end (the laptop's connection matches on this)
options g_ether dev_addr=02:70:69:61:6c:01 host_addr=02:70:69:61:6c:02
